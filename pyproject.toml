[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediadeduplicator"
version = "0.1.0"
description = "A Windows application for detecting duplicate and similar media files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "StoGFly" }
]

dependencies = [
    "PySide6>=6.8",
    "typer>=0.15",
    "SQLAlchemy>=2.0",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "Jinja2>=3.1",
    "platformdirs>=4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"